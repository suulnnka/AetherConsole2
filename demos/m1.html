<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AC2 · M1 demo — 模式1 双层卷轴 + 128 精灵 + 每线 32</title>
<style>
  body { background: #16161c; color: #c8c8d0; font: 13px/1.5 monospace; display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0; padding: 12px; }
  canvas { image-rendering: pixelated; background: #000; outline: 1px solid #333; }
  #hud { font: 12px monospace; color: #8f8fa0; }
  b { color: #fff; }
</style>
</head>
<body>
<canvas id="scr"></canvas>
<div id="hud"></div>
<script src="../js/core/ansi.js"></script>
<script src="../js/core/comp.js"></script>
<script src="../js/core/mulaw.js"></script>
<script src="../js/core/font.js"></script>
<script src="../js/core/biosfont.js"></script>
<script src="../js/core/cart.js"></script>
<script src="../js/host/input.js"></script>
<script src="../js/host/mode1.js"></script>
<script src="../js/host/mode2.js"></script>
<script src="../js/host/ajs.js"></script>
<script src="../js/host/machine.js"></script>
<script src="../js/shell/shell.js"></script>
<script>
'use strict';
// —— 资产:程序化生成(与编辑器导出的 .til 同格式)——
function makeTileset() {
  const N = 48, buf = new Uint8Array(N * 72);
  const set = (k, fn) => {
    const b = k * 72;
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const v = fn(x, y); // null = 透明
      if (v == null) buf[b + 64 + y] |= (1 << x);
      else buf[b + y * 8 + x] = v;
    }
  };
  // 1..4:地形砖(渐变绿/棕)
  const ramp = (c0, c1, x, y) => AC2.ANSI.fromRgbFast(
    AC2.ANSI.rgbTable[c0 * 3] + (AC2.ANSI.rgbTable[c1 * 3] - AC2.ANSI.rgbTable[c0 * 3]) * (x + y) / 14, 0, 0);
  set(1, (x, y) => (x === 0 || y === 0) ? 71 : (y < 4 ? 71 + 36 * 0 : 71));
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    // 手绘感地形
    const b = 1 * 72;
    if (!(x === 0 || y === 0)) { buf[b + y * 8 + x] = (y < 3) ? 114 + ((x * 7 + y) % 5) : 100 + ((x + y * 3) % 4); buf[b + 64 + y] &= ~(1 << x); }
  }
  set(2, (x, y) => (x === 7 || y === 7) ? 58 : (94 + ((x * 5 + y * 2) % 4))));
  set(3, (x, y) => ((x + y) & 3) === 0 ? 240 : 238);
  set(4, (x, y) => (x === 3 || x === 4) ? 250 : null);
  // 5..12:星点 tile(BG0)
  for (let k = 5; k < 13; k++) {
    const seed = k * 37;
    set(k, (x, y) => ((x * 13 + y * 7 + seed * 3) % 23 === 0) ? 255 - (k - 5) : null);
  }
  // 16..19:8×8 精灵(实心圆/方块,不同色)
  const colors = [196, 202, 46, 51];
  for (let i = 0; i < 4; i++) {
    set(16 + i, (x, y) => {
      const dx = x - 3.5, dy = y - 3.5;
      return (dx * dx + dy * dy <= 11) ? colors[i] : null;
    });
  }
  // 24..27:16×16 精灵(4 tile 一组:TL,TR,BL,BR)— 渐变菱形
  for (let qy = 0; qy < 2; qy++) for (let qx = 0; qx < 2; qx++) {
    const k = 24 + qy * 2 + qx;
    set(k, (x, y) => {
      const gx = qx * 8 + x - 7.5, gy = qy * 8 + y - 7.5;
      const d = Math.abs(gx) + Math.abs(gy);
      if (d > 7.5) return null;
      return d < 3 ? 255 : (d < 5.5 ? 214 : 209);
    });
  }
  return buf;
}

const M = new AC2.Machine({});
M.setMode(1);
const S = M.S;
const tiles = makeTileset();
S.loadTiles('bg', { data: tiles }, 0, 48);
S.loadTiles('obj', { data: tiles }, 0, 48);

// BG0:星空(8× 星点 tile 平铺)
const L0 = new Uint16Array(32 * 32);
for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
  const k = ((x * 31 + y * 17) % 8) + 5;
  if ((x + y * 3) % 3 !== 0) L0[y * 32 + x] = S.entry(k);
}
S.setMap(0, 0, 0, 32, 32, L0);
// BG1:下缘地形
const L1 = new Uint16Array(32 * 32);
for (let y = 18; y < 32; y++) for (let x = 0; x < 32; x++) {
  L1[y * 32 + x] = S.entry((y === 18) ? ((x & 1) ? 3 : 2) : (y < 21 ? 1 : 2));
}
S.setMap(1, 0, 0, 32, 32, L1);
S.backdrop(232 + 2);

// 精灵状态
const sp = [];
for (let i = 0; i < 84; i++) {
  sp.push({
    x: (i * 29) % 220, y: 20 + ((i * 53) % 120),
    vx: (i % 2 ? 1 : -1) * (0.5 + (i % 5) * 0.25), vy: (i % 3 ? 1 : -1) * (0.3 + (i % 4) * 0.2),
    big: i % 3 === 0, tile: i % 3 === 0 ? 24 : 16 + (i % 4)
  });
}
// 40 个同行精灵(演示每线 32 上限):y=8 的一排
const bandN = 40;

function update() {
  const f = M.frame();
  S.scroll(0, f * 0.4, f * 0.12);
  S.scroll(1, f * 1.5, 0);
  for (let i = 0; i < sp.length; i++) {
    const s = sp[i];
    s.x += s.vx; s.y += s.vy;
    if (s.x < -16 || s.x > 244) s.vx = -s.vx;
    if (s.y < 0 || s.y > 160) s.vy = -s.vy;
    S.setSprite(i, { x: s.x | 0, y: s.y | 0, tile: s.tile + ((f >> 3) & 1 && !s.big ? 0 : 0), big: s.big, prio: s.big ? 2 : 0 });
  }
  // 同行 40 个 → 每线 8 个被丢(§6.3.4)
  for (let i = 0; i < bandN; i++) {
    S.setSprite(84 + i, { x: (i * 6 + (f >> 2)) % 236, y: 8, tile: 16 + (i & 3), prio: 3 });
  }
}

const shell = new AC2.Shell(document.getElementById('scr'), { machine: M });
shell.onBeforeStep = () => update();
shell.start();

const hud = document.getElementById('hud');
setInterval(() => {
  hud.innerHTML =
    'fps <b>' + shell.fps + '</b> · frame ' + M.frameCount +
    ' · logic <b>' + M.stats.logicMs.toFixed(2) + 'ms</b> · compose <b>' + M.stats.drawMs.toFixed(2) + 'ms</b>' +
    ' · 精灵 128(其中同行带 40) · 每线丢弃行累计/帧 <b>' + M.m1.droppedLines + '</b>' +
    ' · 完全丢弃精灵 <b>' + M.m1.droppedSprites + '</b>';
}, 250);
</script>
</body>
</html>
